name: Static Analysis

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# REUSE and Markdown Links run as part of the Repository Standards workflow.
jobs:
  swiftlint:
    name: SwiftLint
    uses: SchmiedmayerLab/.github/.github/workflows/swiftlint.yml@v0.5
    permissions:
      contents: read
  periphery:
    name: Periphery
    uses: SchmiedmayerLab/.github/.github/workflows/periphery.yml@v0.5
    permissions:
      contents: read
    with:
      runsonlabels: '["macOS", "self-hosted"]'
      strict: false
  codeql:
    name: CodeQL
    uses: SchmiedmayerLab/.github/.github/workflows/xcodebuild.yml@v0.5
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      codeql: true
      scheme: MyHeartCounts
      test: false
      xcodeversion: 26.4
